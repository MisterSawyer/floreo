<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="only light" />
		<meta name="theme-color" content="#eaf2e6" />
		<title>%sveltekit.error.message%</title>

		<style>
			:root {
				color-scheme: only light;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 100vh;
				margin: 0;
				background: #eaf2e6;
				color: #173d2c;
				font-family: system-ui, sans-serif;
			}

			.error {
				display: flex;
				align-items: center;
				max-width: 32rem;
				margin: 0 1rem;
			}

			.status {
				position: relative;
				top: -0.05rem;
				font-size: 3rem;
				font-weight: 200;
				line-height: 1;
			}

			.message {
				display: flex;
				min-height: 2.5rem;
				align-items: center;
				margin: 0 0 0 1rem;
				padding: 0 0 0 1rem;
				border-left: 1px solid #9eb4a5;
			}

			.message h1 {
				margin: 0;
				font-size: 1em;
				font-weight: 400;
			}
		</style>
	</head>
	<body>
		<div class="error">
			<span class="status">%sveltekit.status%</span>
			<div class="message">
				<h1>%sveltekit.error.message%</h1>
			</div>
		</div>
	</body>
</html>
